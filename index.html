<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Equations Solver - Two Unknowns | Step by Step</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f5f7fc 0%, #e9eef5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .calculator-container {
            max-width: 750px;
            width: 100%;
            background: #ffffffdd;
            backdrop-filter: blur(2px);
            border-radius: 48px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.1), 0 5px 12px rgba(0,0,0,0.06);
            padding: 20px 25px 30px;
            border: 1px solid rgba(255,255,255,0.5);
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #1e2a3e;
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        h1 span {
            background: #2c3e66;
            color: white;
            font-size: 1rem;
            padding: 5px 12px;
            border-radius: 40px;
        }
        .sub {
            text-align: center;
            color: #2c3e66;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .equations {
            background: #f8fafc;
            border-radius: 32px;
            padding: 15px 20px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 0 1px #ffffff80, 0 6px 12px rgba(0,0,0,0.02);
        }
        .eq-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            background: white;
            padding: 15px 12px;
            border-radius: 28px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .eq-row:last-child {
            margin-bottom: 0;
        }
        .coeff {
            width: 85px;
            text-align: center;
        }
        .coeff input {
            width: 100%;
            padding: 12px 8px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #cbd5e1;
            border-radius: 28px;
            background: white;
            font-weight: 600;
            transition: 0.2s;
        }
        .coeff input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px #3b82f640;
        }
        .var-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #0f172a;
            width: 30px;
            text-align: center;
        }
        .eq-sign {
            font-size: 1.5rem;
            font-weight: 600;
            color: #334155;
        }
        .result-box {
            background: #0f172a;
            color: white;
            border-radius: 36px;
            padding: 18px 20px;
            margin: 20px 0;
            text-align: center;
        }
        .result-main {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .result-main span {
            background: #3b82f6;
            padding: 4px 12px;
            border-radius: 60px;
            margin: 0 5px;
        }
        .steps {
            background: #f1f5f9;
            border-radius: 28px;
            padding: 16px 20px;
            margin-top: 20px;
            font-size: 0.95rem;
            border-left: 5px solid #3b82f6;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 320px;
            overflow-y: auto;
        }
        .steps h3 {
            margin-top: 0;
            color: #1e293b;
            font-family: sans-serif;
        }
        button {
            background: #2c3e66;
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 14px 20px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        button:hover {
            background: #1e2a47;
            transform: scale(0.98);
        }
        .method-buttons {
            display: flex;
            gap: 12px;
            margin: 10px 0 5px;
        }
        .method-buttons button {
            background: #475569;
            margin-top: 0;
        }
        .method-buttons button.active {
            background: #3b82f6;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #3b82f6;
        }
        .footer {
            font-size: 0.75rem;
            text-align: center;
            margin-top: 20px;
            color: #5b6e8c;
        }
        @media (max-width: 550px) {
            .coeff { width: 65px; }
            .coeff input { padding: 8px 4px; font-size: 1rem; }
            .result-main { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="calculator-container">
    <h1>📐 Linear Equations Solver <span>Two Unknowns</span></h1>
    <div class="sub">ax + by = c   |   dx + ey = f</div>

    <div class="equations">
        <!-- Equation 1 -->
        <div class="eq-row">
            <div class="coeff"><input type="number" id="a1" value="2" step="any" placeholder="a₁"></div>
            <div class="var-name">x</div>
            <div class="coeff"><input type="number" id="b1" value="3" step="any" placeholder="b₁"></div>
            <div class="var-name">y</div>
            <div class="eq-sign">=</div>
            <div class="coeff"><input type="number" id="c1" value="8" step="any" placeholder="c₁"></div>
        </div>
        <!-- Equation 2 -->
        <div class="eq-row">
            <div class="coeff"><input type="number" id="a2" value="3" step="any" placeholder="a₂"></div>
            <div class="var-name">x</div>
            <div class="coeff"><input type="number" id="b2" value="-1" step="any" placeholder="b₂"></div>
            <div class="var-name">y</div>
            <div class="eq-sign">=</div>
            <div class="coeff"><input type="number" id="c2" value="2" step="any" placeholder="c₂"></div>
        </div>
    </div>

    <div class="method-buttons">
        <button id="methodSubBtn" class="active">🔄 Substitution Method</button>
        <button id="MethodElimBtn">✖️➕ Elimination Method</button>
    </div>
    
    <button id="solveBtn">🧮 Solve System</button>

    <div class="result-box" id="resultBox">
        <div class="result-main" id="solutionText">x = ? &nbsp;&nbsp; y = ?</div>
        <div id="extraNote" style="font-size:0.85rem; margin-top:8px;"></div>
    </div>

    <div class="steps" id="stepsArea">
        <h3>📖 Step-by-Step Solution (Substitution Method)</h3>
        <div id="stepsContent">Click "Solve System" to see detailed steps.</div>
    </div>
    <div class="footer">You can use fractions or decimals. Linear system in two unknowns.</div>
</div>

<script>
    // DOM elements
    const a1 = document.getElementById('a1');
    const b1 = document.getElementById('b1');
    const c1 = document.getElementById('c1');
    const a2 = document.getElementById('a2');
    const b2 = document.getElementById('b2');
    const c2 = document.getElementById('c2');
    const solveBtn = document.getElementById('solveBtn');
    const methodSubBtn = document.getElementById('methodSubBtn');
    const methodElimBtn = document.getElementById('MethodElimBtn');
    const solutionTextSpan = document.getElementById('solutionText');
    const stepsContentDiv = document.getElementById('stepsContent');
    const extraNote = document.getElementById('extraNote');
    
    let currentMethod = "substitution"; // "substitution" or "elimination"
    
    // Toggle active method buttons
    methodSubBtn.addEventListener('click', () => {
        currentMethod = "substitution";
        methodSubBtn.classList.add('active');
        methodElimBtn.classList.remove('active');
        document.querySelector('#stepsArea h3').innerHTML = '📖 Step-by-Step Solution (Substitution Method)';
        if (document.getElementById('stepsContent').innerText !== 'Click "Solve System" to see detailed steps.')
            solveBtn.click();
        else
            stepsContentDiv.innerHTML = 'Click "Solve System" to see detailed steps.';
    });
    methodElimBtn.addEventListener('click', () => {
        currentMethod = "elimination";
        methodElimBtn.classList.add('active');
        methodSubBtn.classList.remove('active');
        document.querySelector('#stepsArea h3').innerHTML = '📖 Step-by-Step Solution (Elimination Method)';
        if (document.getElementById('stepsContent').innerText !== 'Click "Solve System" to see detailed steps.')
            solveBtn.click();
        else
            stepsContentDiv.innerHTML = 'Click "Solve System" to see detailed steps.';
    });
    
    // Helper: format numbers nicely (avoid too many decimals)
    function formatNumber(value) {
        if (Math.abs(value) < 1e-10) return "0";
        let rounded = Math.round(value * 1e8) / 1e8;
        if (Math.abs(rounded - Math.round(rounded)) < 1e-8) return Math.round(rounded).toString();
        let str = rounded.toString();
        if (str.length > 12) str = rounded.toFixed(6);
        return str;
    }
    
    // Main solving function
    function solveSystem() {
        // Parse values
        const a1v = parseFloat(a1.value);
        const b1v = parseFloat(b1.value);
        const c1v = parseFloat(c1.value);
        const a2v = parseFloat(a2.value);
        const b2v = parseFloat(b2.value);
        const c2v = parseFloat(c2.value);
        
        if (isNaN(a1v) || isNaN(b1v) || isNaN(c1v) || isNaN(a2v) || isNaN(b2v) || isNaN(c2v)) {
            solutionTextSpan.innerHTML = "⚠️ Error: Please enter valid numbers";
            stepsContentDiv.innerHTML = "Make sure all fields contain numeric values.";
            extraNote.innerHTML = "";
            return;
        }
        
        const det = a1v * b2v - a2v * b1v;
        
        // Special cases: dependent or inconsistent
        if (Math.abs(det) < 1e-12) {
            const ratioA = (Math.abs(a1v) > 1e-12) ? a2v / a1v : (Math.abs(b1v) > 1e-12) ? b2v / b1v : NaN;
            let consistent = false;
            if (!isNaN(ratioA)) {
                const rhsRatio = (Math.abs(c1v) > 1e-12) ? c2v / c1v : (Math.abs(c1v) < 1e-12 && Math.abs(c2v) < 1e-12) ? ratioA : NaN;
                if (!isNaN(rhsRatio) && Math.abs(ratioA - rhsRatio) < 1e-10) consistent = true;
            }
            if (consistent && (Math.abs(a1v) > 1e-12 || Math.abs(b1v) > 1e-12 || Math.abs(a2v) > 1e-12 || Math.abs(b2v) > 1e-12)) {
                solutionTextSpan.innerHTML = "⚠️ Dependent system (infinitely many solutions)";
                stepsContentDiv.innerHTML = "The two equations are multiples of each other. Infinite solutions exist.";
                extraNote.innerHTML = "Equations are not linearly independent.";
            } else {
                solutionTextSpan.innerHTML = "⚠️ Inconsistent system (no solution)";
                stepsContentDiv.innerHTML = "The equations are parallel but distinct. No intersection point.";
                extraNote.innerHTML = "No solution satisfies both equations.";
            }
            return;
        }
        
        // Cramer's rule for exact values
        const xCramer = (c1v * b2v - c2v * b1v) / det;
        const yCramer = (a1v * c2v - a2v * c1v) / det;
        
        let stepsHtml = "";
        let solutionMsg = `x = ${formatNumber(xCramer)} &nbsp;&nbsp; y = ${formatNumber(yCramer)}`;
        extraNote.innerHTML = `Determinant = ${formatNumber(det)} ≠ 0 → Unique solution.`;
        
        if (currentMethod === "substitution") {
            // Substitution method with detailed steps
            stepsHtml = `📍 <strong>System:</strong><br>
                         (1)  ${a1v} x + ${b1v} y = ${c1v}<br>
                         (2)  ${a2v} x + ${b2v} y = ${c2v}<br><br>`;
            
            // Prefer isolating x from first equation if possible
            if (Math.abs(a1v) > 1e-12) {
                // Isolate x
                stepsHtml += `🔹 <strong>From equation (1), isolate x:</strong><br>`;
                stepsHtml += `&nbsp;&nbsp;&nbsp; ${a1v} x = ${c1v} - ${b1v} y<br>`;
                stepsHtml += `&nbsp;&nbsp;&nbsp; x = (${c1v} - ${b1v} y) / ${a1v}<br>`;
                const termB = -b1v / a1v;
                const termC = c1v / a1v;
                stepsHtml += `&nbsp;&nbsp;&nbsp; x = ${formatNumber(termC)} ${termB >= 0 ? '+' : '-'} ${formatNumber(Math.abs(termB))} y<br><br>`;
                
                // Substitute into second equation
                stepsHtml += `🔹 <strong>Substitute into equation (2):</strong><br>`;
                stepsHtml += `&nbsp;&nbsp;&nbsp; ${a2v}·x + ${b2v} y = ${c2v}<br>`;
                stepsHtml += `&nbsp;&nbsp;&nbsp; ${a2v}·(${formatNumber(termC)} ${termB >=0 ? '+' : '-'} ${formatNumber(Math.abs(termB))} y) + ${b2v} y = ${c2v}<br>`;
                const multipliedA = a2v * termC;
                const coeffY = a2v * termB + b2v;
                stepsHtml += `&nbsp;&nbsp;&nbsp; ${formatNumber(multipliedA)} + ${formatNumber(coeffY)} y = ${c2v}<br>`;
                const yValue = (c2v - multipliedA) / coeffY;
                stepsHtml += `&nbsp;&nbsp;&nbsp; ${formatNumber(coeffY)} y = ${c2v} - ${formatNumber(multipliedA)} = ${formatNumber(c2v - multipliedA)}<br>`;
                stepsHtml += `&nbsp;&nbsp;&nbsp; y = ${formatNumber(yValue)}<br><br>`;
                
                // Find x
                const xValue = termC + termB * yValue;
                stepsHtml += `🔹 <strong>Back-substitute y into expression for x:</strong><br>`;
                stepsHtml += `&nbsp;&nbsp;&nbsp; x = ${formatNumber(termC)} ${termB >=0 ? '+' : '-'} ${formatNumber(Math.abs(termB))}·(${formatNumber(yValue)}) = ${formatNumber(xValue)}<br><br>`;
                stepsHtml += `✅ <strong>Solution:</strong> x = ${formatNumber(xValue)} &nbsp;&nbsp; y = ${formatNumber(yValue)}`;
            } 
            else if (Math.abs(b1v) > 1e-12) {
                // Isolate y from first equation
                stepsHtml += `🔹 <strong>From equation (1), isolate y:</strong><br>`;
                stepsHtml += `&nbsp;&nbsp;&nbsp; ${b1v} y = ${c1v} - ${a1v} x<br>`;
                stepsHtml += `&nbsp;&nbsp;&nbsp; y = (${c1v} - ${a1v} x) / ${b1v}<br>`;
                const termA = -a1v / b1v;
                const termConst = c1v / b1v;
                stepsHtml += `&nbsp;&nbsp;&nbsp; y = ${formatNumber(termConst)} ${termA >= 0 ? '+' : '-'} ${formatNumber(Math.abs(termA))} x<br><br>`;
                
                stepsHtml += `🔹 <strong>Substitute into equation (2):</strong><br>`;
                stepsHtml += `&nbsp;&nbsp;&nbsp; ${a2v} x + ${b2v}·y = ${c2v}<br>`;
                stepsHtml += `&nbsp;&nbsp;&nbsp; ${a2v} x + ${b2v}·(${formatNumber(termConst)} ${termA >=0 ? '+' : '-'} ${formatNumber(Math.abs(termA))} x) = ${c2v}<br>`;
                const coeffX = a2v + b2v * termA;
                const constTermCalc = b2v * termConst;
                stepsHtml += `&nbsp;&nbsp;&nbsp; (${formatNumber(a2v)} ${(b2v*termA) >=0 ? '+' : '-'} ${formatNumber(Math.abs(b2v*termA))}) x + ${formatNumber(constTermCalc)} = ${c2v}<br>`;
                stepsHtml += `&nbsp;&nbsp;&nbsp; ${formatNumber(coeffX)} x = ${c2v} - ${formatNumber(constTermCalc)} = ${formatNumber(c2v - constTermCalc)}<br>`;
                const xValue = (c2v - constTermCalc) / coeffX;
                stepsHtml += `&nbsp;&nbsp;&nbsp; x = ${formatNumber(xValue)}<br><br>`;
                const yValue = termConst + termA * xValue;
                stepsHtml += `🔹 <strong>Back-substitute x into expression for y:</strong><br>`;
                stepsHtml += `&nbsp;&nbsp;&nbsp; y = ${formatNumber(termConst)} ${termA >=0 ? '+' : '-'} ${formatNumber(Math.abs(termA))}·(${formatNumber(xValue)}) = ${formatNumber(yValue)}<br><br>`;
                stepsHtml += `✅ <strong>Solution:</strong> x = ${formatNumber(xValue)} &nbsp;&nbsp; y = ${formatNumber(yValue)}`;
            }
            else {
                stepsHtml = "⚠️ First equation has both coefficients zero (invalid).";
            }
        } 
        else { // Elimination method
            stepsHtml = `📍 <strong>System:</strong><br>`;
            stepsHtml += `(1)  ${a1v} x + ${b1v} y = ${c1v}<br>`;
            stepsHtml += `(2)  ${a2v} x + ${b2v} y = ${c2v}<br><br>`;
            
            // Try to eliminate x first
            if (Math.abs(a1v) > 1e-12 && Math.abs(a2v) > 1e-12) {
                const mul1 = a2v;
                const mul2 = a1v;
                stepsHtml += `🔹 <strong>Eliminate x:</strong><br>`;
                stepsHtml += `&nbsp;&nbsp; Multiply equation (1) by ${formatNumber(mul1)} and equation (2) by ${formatNumber(mul2)}:<br>`;
                const newA1 = a1v * mul1;
                const newB1 = b1v * mul1;
                const newC1 = c1v * mul1;
                const newA2 = a2v * mul2;
                const newB2 = b2v * mul2;
                const newC2 = c2v * mul2;
                stepsHtml += `&nbsp;&nbsp; (1') → ${formatNumber(newA1)} x + ${formatNumber(newB1)} y = ${formatNumber(newC1)}<br>`;
                stepsHtml += `&nbsp;&nbsp; (2') → ${formatNumber(newA2)} x + ${formatNumber(newB2)} y = ${formatNumber(newC2)}<br>`;
                stepsHtml += `&nbsp;&nbsp; Subtract (1') - (2') to eliminate x:<br>`;
                const subB = newB1 - newB2;
                const subC = newC1 - newC2;
                stepsHtml += `&nbsp;&nbsp; (${formatNumber(newB1)} - ${formatNumber(newB2)}) y = ${formatNumber(newC1)} - ${formatNumber(newC2)}<br>`;
                stepsHtml += `&nbsp;&nbsp; ${formatNumber(subB)} y = ${formatNumber(subC)}<br>`;
                const yValue = subC / subB;
                stepsHtml += `&nbsp;&nbsp; ∴ y = ${formatNumber(yValue)}<br><br>`;
                
                stepsHtml += `🔹 <strong>Substitute y = ${formatNumber(yValue)} into equation (1):</strong><br>`;
                stepsHtml += `&nbsp;&nbsp; ${a1v} x + ${b1v}·(${formatNumber(yValue)}) = ${c1v}<br>`;
                stepsHtml += `&nbsp;&nbsp; ${a1v} x + ${formatNumber(b1v * yValue)} = ${c1v}<br>`;
                const xValue = (c1v - b1v * yValue) / a1v;
                stepsHtml += `&nbsp;&nbsp; ${a1v} x = ${c1v} - ${formatNumber(b1v * yValue)} = ${formatNumber(c1v - b1v*yValue)}<br>`;
                stepsHtml += `&nbsp;&nbsp; x = ${formatNumber(xValue)}<br><br>`;
                stepsHtml += `✅ <strong>Solution:</strong> x = ${formatNumber(xValue)} &nbsp;&nbsp; y = ${formatNumber(yValue)}`;
            } 
            else if (Math.abs(b1v) > 1e-12 && Math.abs(b2v) > 1e-12) {
                // Eliminate y
                const mul1 = b2v;
                const mul2 = b1v;
                stepsHtml += `🔹 <strong>Eliminate y:</strong><br>`;
                stepsHtml += `&nbsp;&nbsp; Multiply equation (1) by ${formatNumber(mul1)} and equation (2) by ${formatNumber(mul2)}:<br>`;
                const newA1 = a1v * mul1;
                const newB1 = b1v * mul1;
                const newC1 = c1v * mul1;
                const newA2 = a2v * mul2;
                const newB2 = b2v * mul2;
                const newC2 = c2v * mul2;
                stepsHtml += `&nbsp;&nbsp; (1') → ${formatNumber(newA1)} x + ${formatNumber(newB1)} y = ${formatNumber(newC1)}<br>`;
                stepsHtml += `&nbsp;&nbsp; (2') → ${formatNumber(newA2)} x + ${formatNumber(newB2)} y = ${formatNumber(newC2)}<br>`;
                stepsHtml += `&nbsp;&nbsp; Subtract (1') - (2') to eliminate y:<br>`;
                const subA = newA1 - newA2;
                const subC = newC1 - newC2;
                stepsHtml += `&nbsp;&nbsp; ${formatNumber(subA)} x = ${formatNumber(subC)}<br>`;
                const xValue = subC / subA;
                stepsHtml += `&nbsp;&nbsp; ∴ x = ${formatNumber(xValue)}<br><br>`;
                
                stepsHtml += `🔹 <strong>Substitute x = ${formatNumber(xValue)} into equation (1):</strong><br>`;
                stepsHtml += `&nbsp;&nbsp; ${a1v}·(${formatNumber(xValue)}) + ${b1v} y = ${c1v}<br>`;
                const yValue = (c1v - a1v * xValue) / b1v;
                stepsHtml += `&nbsp;&nbsp; ${formatNumber(b1v)} y = ${c1v} - ${formatNumber(a1v*xValue)} = ${formatNumber(c1v - a1v*xValue)}<br>`;
                stepsHtml += `&nbsp;&nbsp; y = ${formatNumber(yValue)}<br><br>`;
                stepsHtml += `✅ <strong>Solution:</strong> x = ${formatNumber(xValue)} &nbsp;&nbsp; y = ${formatNumber(yValue)}`;
            }
            else {
                stepsHtml = "⚠️ Cannot easily eliminate using standard steps, but solution exists via Cramer's rule.";
                stepsHtml += `<br><br>Numerical solution: x = ${formatNumber(xCramer)} , y = ${formatNumber(yCramer)}`;
            }
        }
        
        // Update solution text
        solutionTextSpan.innerHTML = `📐 x = ${formatNumber(xCramer)} &nbsp;&nbsp; 📐 y = ${formatNumber(yCramer)}`;
        if (stepsHtml) stepsContentDiv.innerHTML = stepsHtml;
    }
    
    solveBtn.addEventListener('click', solveSystem);
    window.addEventListener('load', () => {
        solveSystem();
    });
</script>
</body>
</html>
